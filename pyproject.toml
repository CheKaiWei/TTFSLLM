[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ttfsformer"
authors = [{ name = "Lusen Zhao", email = "2200013136@stu.pku.edu.cn" }]
version = "0.0.1"
description = "Single-Spike Vision Transformer based on TTFS"
readme = "README.md"
requires-python = ">= 3.10"
dependencies = ["tqdm", "timm", "torch", "torchvision"]

[tool.setuptools]
packages = ["ttfsformer"]

[tool.black]
line-length = 120
